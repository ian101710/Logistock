<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .card-login {
            background-color: var(--bs-body-bg);
            transition: background-color 0.3s ease;
        }
        [data-bs-theme="dark"] .form-floating > label { color: #adb5bd !important; }
        [data-bs-theme="dark"] .form-control {
            background-color: #2b3035 !important;
            color: #ffffff !important;
            border-color: #495057;
        }
        [data-bs-theme="dark"] .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        [data-bs-theme="dark"] .form-control:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #2b3035 inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 bg-light" id="login-body" style="min-height: 100vh;">

    <main class="form-signin w-100 m-auto" style="max-width: 480px;">
        <div class="card card-login shadow-lg border-0 rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="fw-black text-primary mb-0"><i class="bi bi-box-seam-fill"></i> LogiStock</h2>
                <p class="text-muted small">v2.6</p>
            </div>

            <h3 class="fw-bold mb-2">Crea tu cuenta</h3>
            <p class="text-muted mb-4">Empieza gratis con el plan <strong>Básico</strong> — hasta 50 productos, sin tarjeta de crédito.</p>

            <div th:if="${param.error} != null and ${param.error[0]} == 'email-duplicado'" class="alert alert-danger shadow-sm rounded-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Ya existe una cuenta registrada con ese correo.
            </div>
            <div th:if="${param.error} != null and ${param.error[0]} == 'datos-invalidos'" class="alert alert-danger shadow-sm rounded-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Revisa los datos ingresados e intenta nuevamente.
            </div>

            <form th:action="@{/registro}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control rounded-3" id="nombreCompleto" name="nombreCompleto"
                           placeholder="Nombre completo" required maxlength="150">
                    <label for="nombreCompleto"><i class="bi bi-person me-1"></i> Nombre completo</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control rounded-3" id="email" name="email"
                           placeholder="nombre@correo.com" required autocomplete="email" maxlength="150">
                    <label for="email"><i class="bi bi-envelope me-1"></i> Correo electrónico</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control rounded-3" id="password" name="password"
                           placeholder="Contraseña" required autocomplete="new-password" minlength="6">
                    <label for="password"><i class="bi bi-shield-lock me-1"></i> Contraseña (mín. 6 caracteres)</label>
                </div>

                <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm" type="submit">
                    <i class="bi bi-rocket-takeoff"></i> Crear mi cuenta gratis
                </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                ¿Ya tienes cuenta? <a th:href="@{/login}" class="fw-bold text-decoration-none">Inicia sesión</a>
            </p>
        </div>
    </main>
</body>
</html>
