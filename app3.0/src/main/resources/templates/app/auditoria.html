<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{layout/fragments :: nav-dashboard}"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-clock-history text-primary"></i> Registro de Auditoría</h2>
            <span class="badge bg-dark fs-6"><i class="bi bi-list-ul"></i> Total: <span th:text="${#lists.size(auditorias)}">0</span></span>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">Fecha y Hora</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Detalle Técnico</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="audit : ${auditorias}">
                                <td class="ps-4 text-muted" th:text="${#temporals.format(audit.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="fw-bold" th:text="${audit.usuarioEmail}"></td>
                                <td><span class="badge bg-info text-dark" th:text="${audit.accion}"></span></td>
                                <td class="text-muted" th:text="${audit.detalle}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(auditorias)}">
                                <td colspan="4" class="text-center text-muted py-4">Aún no hay movimientos registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/fragments :: footer-app}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
